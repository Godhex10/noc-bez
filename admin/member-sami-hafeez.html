  </div>
</div>


<form class="aform" method="post" action="../admin/member-sami-hafeez.html" enctype="multipart/form-data"><input type="hidden" name="csrf" value="demo"><fieldset disabled>  <div class="edit-grid">
    <div class="card">
      <label class="afield"><span>Name <i>*</i></span>
        <input type="text" name="name" value="Sami Hafeez" required maxlength="100">
              </label>
      <div class="afield-row">
        <label class="afield"><span>Role</span><input type="text" name="role" value="Amazon Seller Central &amp; KDP Expert" maxlength="120" placeholder="e.g. Founder"></label>
        <label class="afield"><span>Focus <small>(optional)</small></span><input type="text" name="focus" value="" maxlength="150" placeholder="e.g. Project Management, Publishing"></label>
      </div>
      <label class="afield"><span>Biography</span>
        <textarea name="bio" rows="12" maxlength="4000">Sami Hafeez is an Amazon Seller Central and Kindle Direct Publishing (KDP) expert with over eight years of experience in e-commerce and Amazon publishing. He holds a master&#039;s degree in Engineering Management.

Having worked with over 1,100 clients worldwide, Sami has experience across a diverse range of products and book genres. He helps authors and sellers navigate the publishing and selling process, from product research and listing optimisation to publishing and marketing on Amazon.

At Noc &amp; Bez Creative, Sami supports book formatting, Amazon keyword research and publishing preparation.</textarea>
        <small class="afield__hint">Leave an empty line between paragraphs.</small>
      </label>
    </div>

    <div class="card card--side">
      <p class="card__label">Photo</p>
      <div class="cover-preview cover-preview--arch">
        <img src="../assets/img/team-sami-hafeez.jpg" alt="Current photo">
      </div>
      <label class="afield"><span>Replace the photo</span>
        <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" data-preview>
                <small class="afield__hint">A clear head-and-shoulders photo works best.</small>
      </label>
      <label class="check"><input type="checkbox" name="remove_photo" value="1"> Remove this photo</label>
    </div>
  </div>

  <div class="form-actions">
    <button class="abtn abtn--primary" name="act" value="save">Save profile</button>
    <a class="abtn abtn--ghost" href="../admin/team.html">Cancel</a>
    <button class="abtn abtn--danger" name="act" value="delete" formnovalidate data-confirm="Remove this person from the team page?">Remove person</button>
  </div>
</fieldset></form>      </main>
